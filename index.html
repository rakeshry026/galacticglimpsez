<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galactic Glimpsez – Astrophotography by Mohammad Adnan</title>
<meta name="description" content="Astrophotography by Mohammad Adnan: deep sky, star trails and meteor showers.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#070b14;--deep:#0e1424;--dust:#1a2238;--star:#e9ecf5;--mute:#9aa3bd;--ha:#d6577b;--oiii:#3fb6a8;--serif:"Cormorant Garamond",Georgia,serif;--sans:Karla,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--star);font:17px/1.65 var(--sans);min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(7,11,20,.5),rgba(7,11,20,.9) 85%),var(--bgimg,none) center/cover no-repeat}
main{flex:1}a{color:inherit}:focus-visible{outline:2px solid var(--oiii);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1}h1{font-size:clamp(2.4rem,7vw,5rem)}h3{font-size:1.5rem}p{max-width:62ch;color:#c9cfe0}
header{border-bottom:1px solid rgba(233,236,245,.12);background:rgba(7,11,20,.35);backdrop-filter:blur(6px)}
nav{display:flex;justify-content:space-between;align-items:center;min-height:64px;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-size:1.4rem;text-decoration:none;display:flex;align-items:center;gap:10px}.logo img{border-radius:50%}
nav ul{display:flex;gap:24px;list-style:none;padding:0}nav ul a{text-decoration:none;color:var(--mute)}nav ul a:hover{color:var(--star)}
.mark{width:112px;height:112px;border-radius:50%;margin:0 auto 20px;display:block;box-shadow:0 0 0 1px var(--dust),0 0 40px rgba(63,182,168,.25)}
.intro{text-align:center;padding:88px 24px 64px}.intro h1{text-transform:uppercase;letter-spacing:.16em;font-size:clamp(1.9rem,6vw,4rem)}.intro p{margin:20px auto 0;color:var(--star);font:italic 1.45rem var(--serif);opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:24px;padding-bottom:96px}
.card{display:block;text-decoration:none;text-align:center}.ph{aspect-ratio:3/2;overflow:hidden;background:var(--dust)}
.card img,.shot img{display:block;width:100%;filter:grayscale(1) contrast(1.05);transition:filter .6s ease,transform .6s ease}.card img{height:100%;object-fit:cover}
.card:hover img,.card:focus-visible img,.shot button:hover img,.shot button:focus-visible img{filter:none}.card:hover img{transform:scale(1.04)}
.cap{padding:16px 8px 0}.card h3{font-size:1.35rem;text-transform:uppercase;letter-spacing:.2em}.card small,.shot p{display:block;color:var(--mute);font-size:.9rem;margin-top:4px}
.cols{columns:2 420px;column-gap:32px;padding-bottom:96px}.shot{break-inside:avoid;margin:0 0 44px}.shot button{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in}
.shot figcaption{padding:14px 2px 0}.shot h3{font-size:1.4rem}
@media(hover:none){.card img,.shot img{filter:none}}
.sub{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin:20px 0 40px}.sub a{color:var(--mute);text-decoration:none;padding-bottom:4px}.sub a[aria-current]{color:var(--star);border-bottom:1px solid var(--ha)}
.page{padding:64px 0}.page h2{font-size:2rem;margin:48px 0 16px;border-top:1px solid var(--dust);padding-top:28px}.page h2:first-of-type{margin-top:32px;border:0;padding:0}
.ev{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--dust)}.ev img{width:100%;aspect-ratio:3/4;object-fit:cover}
.date{border:1px solid var(--ha);text-align:center;padding:14px 8px;align-self:start;font-size:.9rem;color:var(--mute)}.date b{display:block;font:3rem/1 var(--serif);color:var(--star)}
.ev small{color:var(--mute);display:block;margin:4px 0 10px}.btn{display:inline-block;margin-top:14px;padding:10px 24px;border:1px solid var(--star);border-radius:999px;text-decoration:none;background:none;color:var(--star);cursor:pointer;font:600 1rem var(--sans)}.btn:hover{background:var(--star);color:var(--ink)}
dt{font:1.3rem var(--serif);margin-top:16px}dd{color:#c9cfe0}
footer{border-top:1px solid var(--dust);padding:36px 0;color:var(--mute);font-size:.9rem}footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.soc{display:flex;gap:18px}
#lb{position:fixed;inset:0;background:rgba(3,5,10,.97);display:none;place-items:center;z-index:50;padding:24px;overflow:auto}#lb.open{display:grid}
#lb figure{margin:0;text-align:center;max-width:100%}#lb img{max-width:100%;max-height:82vh;width:auto;height:auto}#lb figcaption{padding-top:14px}#lb h3{font-size:1.5rem}#lb p{color:var(--mute);margin:2px auto 0}
#lb>button{position:absolute;top:18px;right:22px;background:none;border:1px solid var(--dust);color:var(--star);width:42px;height:42px;border-radius:50%;font-size:1.3rem;cursor:pointer}
fieldset{border:1px solid var(--dust);padding:20px;margin:20px 0;display:grid;gap:12px}legend{font:1.4rem var(--serif);padding:0 8px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--mute)}input,select,textarea{background:var(--deep);border:1px solid var(--dust);color:var(--star);padding:10px;border-radius:4px;font:inherit}
output{display:block;white-space:pre-wrap;word-break:break-all;background:var(--deep);padding:12px;font:.85rem monospace;color:var(--oiii);min-height:44px}
@media(max-width:600px){.ev{grid-template-columns:1fr}}
</style></head>

const soc=Object.entries(S.social).filter(e=>e[1]).map(([k,v])=>`<a href="${esc(v)}" rel="noopener">${k}</a>`).join("");
$("#hdr").innerHTML=`<nav class="wrap" aria-label="Main"><a class="logo" href="#/"><img src="${LOGO}" alt="" width="36" height="36">${esc(S.name)}</a><ul><li><a href="#/">Work</a></li><li><a href="#/events">Events</a></li><li><a href="#/about">About</a></li>${S.email?`<li><a href="mailto:${esc(S.email)}">Contact</a></li>`:""}</ul></nav>`;
$("#ftr").innerHTML=`<div class="wrap"><span>© ${new Date().getFullYear()} ${esc(S.owner)}. All rights reserved.</span><span class="soc">${soc}</span></div>`;
const today=()=>new Date().toISOString().slice(0,10);
const card=(href,title,src,sub)=>`<a class="card" href="${href}"><div class="ph">${img(src,title)}</div><div class="cap"><h3>${esc(title)}</h3>${sub?`<small>${esc(sub)}</small>`:""}</div></a>`;
let T=S.name;
const views={
 home(){T=S.name+" – Astrophotography by "+S.owner;
  const cats=S.categories.map(c=>{const ps=S.photos.filter(p=>p.cat===c.id);return card("#/gallery/"+c.id,c.title,ps[0]&&ps[0].src,ps.length+" images")});
  const up=S.events.filter(e=>e.date>=today()).length;
  return `<section class="intro"><img class="mark" src="${LOGO}" alt="${esc(S.name)} logo"><h1>${esc(S.name)}</h1><p>${esc(S.tagline)}</p></section><div class="wrap grid">${cats.join("")}${card("#/events","Events",(S.tiles||{}).events,up?up+" upcoming":"Past and upcoming")}${card("#/about","About me",(S.tiles||{}).about,"Story and gear")}</div>`},
 gallery(id){const c=S.categories.find(x=>x.id===id)||S.categories[0];T=c.title+" – "+S.name;
  const ps=S.photos.filter(p=>p.cat===c.id);
  return `<section class="intro" style="padding-bottom:0"><h1>${esc(c.title)}</h1></section><div class="sub">${S.categories.map(x=>`<a href="#/gallery/${x.id}"${x.id===c.id?' aria-current="page"':""}>${esc(x.title)}</a>`).join("")}</div><div class="wrap cols">${ps.length?ps.map(p=>`<figure class="shot"><button class="open" data-t="${esc(p.title)}" data-n="${esc(p.info)}" aria-label="View ${esc(p.title)} full size">${img(p.src,p.title)}</button><figcaption><h3>${esc(p.title)}</h3><p>${esc(p.info)}</p></figcaption></figure>`).join(""):"<p>No images here yet.</p>"}</div>`},
 events(){T="Events – "+S.name;
  const ev=e=>{const d=new Date(e.date+"T00:00");return `<article class="ev">${e.poster?`<img src="${esc(e.poster)}" alt="">`:`<div class="date"><b>${d.getDate()}</b>${d.toLocaleString("en",{month:"short",year:"numeric"})}</div>`}<div><h3>${esc(e.title)}</h3><small>${esc(e.place)}${e.price?" · "+esc(e.price):""}</small><p>${esc(e.desc)}</p>${e.link?`<a class="btn" href="${esc(e.link)}" rel="noopener">Details and booking</a>`:""}</div></article>`};
  const up=S.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)),past=S.events.filter(e=>e.date<today()).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="wrap page"><h1>Events</h1><h2>Upcoming</h2>${up.length?up.map(ev).join(""):"<p>No upcoming events right now. Follow on social media for announcements.</p>"}<h2>Past</h2>${past.length?past.map(ev).join(""):"<p>Past events will appear here.</p>"}</div>`},
 about(){T="About – "+S.name;
  return `<div class="wrap page"><h1>About ${esc(S.owner)}</h1><h2>Story</h2>${S.about.map(p=>`<p>${esc(p)}</p>`).join("")}${S.gear.length?`<h2>Gear</h2><dl>${S.gear.map(g=>`<dt>${esc(g.name)}</dt><dd>${esc(g.desc)}</dd>`).join("")}</dl>`:""}</div>`},
 admin(){T="Content helper";
  return `<div class="wrap page" id="adm"><h1>Content helper</h1><p>Fill a form, copy the line it creates and paste it into the CONTENT block at the top of the script in index.html (inside photos or events). Copy the photo file next to index.html first, then upload again. This page saves nothing itself.</p>
<fieldset><legend>Add a photo</legend><label>Category<select id="pc">${S.categories.map(c=>`<option>${esc(c.id)}</option>`).join("")}</select></label><label>Photo file name (e.g. M_42.jpg)<input id="pf"></label><label>Title<input id="pt"></label><label>Description<input id="pi"></label><output id="po"></output><button class="btn" data-copy="po">Copy line</button></fieldset>
<fieldset><legend>Add an event</legend><label>Title<input id="et"></label><label>Date<input id="ed" type="date"></label><label>Place<input id="ep"></label><label>Price (optional)<input id="ec"></label><label>Description<textarea id="edd" rows="3"></textarea></label><label>Booking link (optional)<input id="el" type="url"></label><label>Poster file name (optional)<input id="epo"></label><output id="eo"></output><button class="btn" data-copy="eo">Copy line</button></fieldset></div>`}
};
const g=i=>{const e=document.getElementById(i);return e?e.value.trim():""},J=JSON.stringify;
function adm(){const p=document.getElementById("po");if(!p)return;p.textContent=" {cat:"+J(g("pc"))+",src:"+J(g("pf"))+",title:"+J(g("pt"))+",info:"+J(g("pi"))+"},";
 document.getElementById("eo").textContent=" {title:"+J(g("et"))+",date:"+J(g("ed"))+",place:"+J(g("ep"))+",desc:"+J(g("edd"))+",link:"+J(g("el"))+",poster:"+J(g("epo"))+",price:"+J(g("ec"))+"},"}
function route(){const [r,a]=location.hash.replace(/^#\/?/,"").split("/");
 $("#app").innerHTML=(views[r||"home"]||views.home)(a);document.title=T;window.scrollTo(0,0);adm()}
addEventListener("hashchange",route);route();
const lb=$("#lb");
document.addEventListener("input",adm);
document.addEventListener("click",e=>{const c=e.target.closest("[data-copy]");if(c){navigator.clipboard.writeText(document.getElementById(c.dataset.copy).textContent);c.textContent="Copied";return}
 const b=e.target.closest("button.open");
 if(b){const i=$("img",b);$("img",lb).src=i.currentSrc||i.src;$("img",lb).alt=b.dataset.t;$("figcaption",lb).innerHTML=`<h3>${esc(b.dataset.t)}</h3><p>${esc(b.dataset.n)}</p>`;lb.classList.add("open");$("button",lb).focus()}
 else if(e.target===lb||e.target.closest("#lb>button"))lb.classList.remove("open")});
addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("open")});

</script></body></html>
