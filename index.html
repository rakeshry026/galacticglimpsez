const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const cur=S.currency||"₹",money=n=>cur+Number(n).toLocaleString("en-IN");
const img=(src,alt,o)=>{o=o||{};return src?`<img src="${esc(o.t?"thumb_"+src:src)}" alt="${esc(alt)}" loading="${o.e?"eager":"lazy"}" decoding="async"${o.t?` onerror="this.onerror=null;this.src='${esc(src)}'"`:""}>`:""};
const fdate=d=>d?new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"}):"";
if(S.background)document.documentElement.style.setProperty("--bgimg","url('"+S.background+"')");
const ic=document.createElement("link");ic.rel="icon";ic.href=LOGO;document.head.appendChild(ic);
/* ---- cart ---- */
let cart={};try{cart=JSON.parse(localStorage.getItem("gg_cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("gg_cart",JSON.stringify(cart))}catch(e){}};
const items=()=>[...S.photos.filter(p=>p.price).map(p=>({id:"p:"+p.src,title:"Print: "+p.title,price:+p.price,src:p.src,desc:p.printNote||"Limited edition print"})),...(S.products||[]).map(p=>({id:"s:"+p.id,title:p.title,price:+p.price,src:p.src,desc:p.desc||""}))];
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const navCount=()=>{const e=$("#cc");if(e)e.textContent=count()};
/* ---- frame ---- */
const NAV=[["home","Home","#/"],["portfolio","Portfolio","#/portfolio"],["blog","Blogs","#/blog"],["resources","Tutorials & Resources","#/resources"],["events","Sessions & Events","#/events"],["about","About Me","#/about"],["contact","Contact","#/contact"]];
$("#hdr").innerHTML=`<nav class="wrap" aria-label="Main"><a class="logo" href="#/"><img src="${LOGO}" alt="" width="36" height="36">${esc(S.name)}</a><button id="mb" aria-expanded="false" aria-controls="nl">Menu</button><ul id="nl">${NAV.map(n=>`<li><a data-r="${n[0]}" href="${n[2]}">${esc(n[1])}</a></li>`).join("")}<li><a data-r="cart" href="#/cart">Cart (<span id="cc">0</span>)</a></li></ul></nav>`;
const soc=Object.entries(S.social).filter(e=>e[1]).map(([k,v])=>`<a href="${esc(v)}" rel="noopener">${k}</a>`).join("");
$("#ftr").innerHTML=`<div class="wrap"><span>© ${new Date().getFullYear()} ${esc(S.owner)}. All rights reserved.</span><span class="soc">${soc}</span></div>`;
const today=()=>new Date().toISOString().slice(0,10);
const card=(href,title,src,sub)=>`<a class="card" href="${href}"><div class="ph">${img(src,title,{t:1,e:1})}</div><div class="cap"><h3>${esc(title)}</h3>${sub?`<small>${esc(sub)}</small>`:""}</div></a>`;
const latest=()=>{const l=(S.latest||[]).map(f=>S.photos.find(p=>p.src===f)).filter(Boolean);return l.length?l:S.photos.slice(0,8)};
const idx=p=>S.photos.indexOf(p);
const shots=ps=>ps.length?`<div class="wrap cols">${ps.map(p=>`<figure class="shot"><button class="open" data-i="${idx(p)}" aria-label="View ${esc(p.title)} with details">${img(p.src,p.title)}</button><figcaption class="cr"><div><h3>${esc(p.title)}</h3><p>${esc(p.info)}</p>${p.price?`<p class="pr">Print available · ${money(p.price)}</p>`:""}</div><button class="gic open" data-i="${idx(p)}" data-gear="1" title="Equipment behind this image" aria-label="Equipment behind ${esc(p.title)}">${ICON}</button></figcaption></figure>`).join("")}</div>`:`<div class="wrap"><p>No images here yet.</p></div>`;
const order=()=>{const l=items().filter(x=>cart[x.id]);return "Hello, I would like to order:\n"+l.map(x=>`${cart[x.id]} x ${x.title} - ${money(x.price*cart[x.id])}`).join("\n")+"\nTotal: "+money(l.reduce((a,x)=>a+x.price*cart[x.id],0))};
let T=S.name;
const views={
 home(){T=S.name+" – Astrophotography by "+S.owner;
  const L=latest(),n=L.length||1,reps=Math.max(1,Math.ceil(8/n));
  const one=L.map(p=>`<figure class="slide"><button class="open" data-i="${idx(p)}" aria-label="Open ${esc(p.title)}">${img(p.src,p.title,{t:1,e:1})}</button><figcaption>${esc(p.title)}</figcaption></figure>`).join("");
  const grp=one.repeat(reps),dup=grp.replace(/<button class="open"/g,'<button class="open" tabindex="-1" aria-hidden="true"');
  return `<section class="intro"><img class="mark" src="${LOGO}" alt="${esc(S.name)} logo"><h1>${esc(S.name)}</h1><p class="type" id="type" aria-hidden="true"></p><p class="sr">${esc(S.tagline)}</p></section>
<section class="latest"><div class="wrap lhead"><h2><a href="#/latest">Latest Work</a></h2><a class="more" href="#/latest">View all latest work →</a></div><div class="slider" role="region" aria-label="Latest work"><div class="track" style="--dur:${n*reps*7}s">${grp}${dup}</div></div></section>`},
 portfolio(){T="Portfolio – "+S.name;
  const cats=S.categories.map(c=>{const ps=S.photos.filter(p=>p.cat===c.id);return card("#/gallery/"+c.id,c.title,ps[0]&&ps[0].src,ps.length+(ps.length===1?" image":" images"))}).join("");
  return `<section class="intro" style="padding-bottom:40px"><h1>Portfolio</h1><p>Deep-sky objects, star trails and meteor showers.</p></section><div class="wrap grid">${card("#/latest","Latest Work",(latest()[0]||{}).src,"Newest images")}${cats}</div>`},
 latest(){T="Latest Work – "+S.name;return `<section class="intro" style="padding-bottom:0"><h1>Latest Work</h1></section><div class="sub"><a href="#/portfolio">← Portfolio</a></div>${shots(latest())}`},
 gallery(id){const c=S.categories.find(x=>x.id===id)||S.categories[0];T=c.title+" – "+S.name;
  return `<section class="intro" style="padding-bottom:0"><h1>${esc(c.title)}</h1></section><div class="sub"><a href="#/latest">Latest Work</a>${S.categories.map(x=>`<a href="#/gallery/${x.id}"${x.id===c.id?' aria-current="page"':""}>${esc(x.title)}</a>`).join("")}</div>${shots(S.photos.filter(p=>p.cat===c.id))}`},
 blog(id){const B=S.blogs||[],b=B.find(x=>x.id===id);
  if(b){T=b.title+" – "+S.name;return `<article class="wrap page art"><a class="more" href="#/blog">← All blogs</a><h1 style="margin-top:16px">${esc(b.title)}</h1><small>${fdate(b.date)}</small>${b.cover?img(b.cover,b.title):""}${(b.body||[]).map(p=>`<p>${esc(p)}</p>`).join("")}</article>`}
  T="Blogs – "+S.name;
  return `<div class="wrap page"><h1>Blogs</h1><p>Stories behind individual images, imaging-session notes and processing workflows.</p>${B.length?B.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(b=>`<a class="post" href="#/blog/${esc(b.id)}">${b.cover?img(b.cover,b.title,{t:1}):"<span></span>"}<div><h3>${esc(b.title)}</h3><small>${fdate(b.date)}</small><p>${esc(b.summary)}</p></div></a>`).join(""):"<p style='margin-top:28px'>The first stories are on their way. Check back soon.</p>"}</div>`},
 resources(){T="Tutorials & Resources – "+S.name;const R=S.resources||[],types=[...new Set(R.map(r=>r.type||"Resource"))];
